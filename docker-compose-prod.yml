services:
  ms1-api:
    build: .
    container_name: ms1-api
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-10.0.1.50}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      DB_NAME: ${DB_NAME:-restaurante_db}
      MS2_URL: ${MS2_URL:-http://ms2-api:8082}
    ports:
      - "8000:8000"
    networks:
      - prod-network

networks:
  prod-network:
    driver: bridge